name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DIST_DIR: dist/recursica-proto-angular/browser

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Build
        run: npm run build -- --base-href=/${{ github.event.repository.name }}/

      - name: Add 404 fallback for client-side routing
        run: cp ${{ env.DIST_DIR }}/index.html ${{ env.DIST_DIR }}/404.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ env.DIST_DIR }}
