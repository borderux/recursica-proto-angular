name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

env:
  DIST_DIR: dist/recursica-proto-angular/browser

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci
        env:
          HUSKY: "0"

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build -- --base-href=/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

      - name: Add 404 fallback for client-side routing
        if: github.event.action != 'closed'
        run: cp ${{ env.DIST_DIR }}/index.html ${{ env.DIST_DIR }}/404.html

      # Deploys the preview on open/reopen/synchronize, and tears it down
      # (removing the pr-preview/pr-<number>/ folder + updating its PR
      # comment) on close — the action itself branches on github.event.action.
      - name: Deploy or tear down preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ${{ env.DIST_DIR }}
